services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: rutaviva_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: rutaviva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rutaviva_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
